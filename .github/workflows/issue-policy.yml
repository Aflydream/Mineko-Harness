name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Bind trusted policy to this repository
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const [organization, repository] = process.env.REPOSITORY.split('/', 2)
          if (!organization || !repository) throw new Error(`Invalid repository: ${process.env.REPOSITORY}`)
          const path = '.github/issue-management/config.json'
          const config = JSON.parse(fs.readFileSync(path, 'utf8'))
          config.organization = organization
          config.repository = repository
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`)
          NODE
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
