[package]
name = "mineko-harness-desktop"
version = "0.1.0-rc.5"
description = "Native WebView2 shell for MiNeko Harness"
authors = ["Aflydream"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[[bin]]
name = "MiNekoHarness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-single-instance = "2.3.6"
url = "2.5.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
