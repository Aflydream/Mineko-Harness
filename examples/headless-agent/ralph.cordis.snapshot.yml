# Replay counterpart to cordis.yml for the shipped Ralph-loop snapshot.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@aflydream/mnh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@aflydream/mnh-llm-replay'
